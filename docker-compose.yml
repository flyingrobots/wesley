version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wesley
      POSTGRES_PASSWORD: wesley_test
      POSTGRES_DB: wesley_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run alphabetically: extensions → schema → wes_ops → seed → tests
      - ./test/fixtures/postgres/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      - ./test/fixtures/examples/out/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./test/fixtures/postgres/02-wes-ops-schema.sql:/docker-entrypoint-initdb.d/02-wes-ops-schema.sql:ro
      - ./test/fixtures/postgres/03-seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
      - ./test/fixtures/examples/out/tests.sql:/docker-entrypoint-initdb.d/04-tests.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wesley -d wesley_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgTAP test runner — installs pgTAP into the postgres service, applies ops SQL,
  # then runs all *.pgtap.sql test files via psql (matching CI approach).
  pgtap:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: wesley
      PGPASSWORD: wesley_test
      PGDATABASE: wesley_test
    volumes:
      - ./test/fixtures/examples/tests:/tests:ro
      - ./test/fixtures/examples/out/ops:/ops:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo '--- Applying ops SQL (views then functions) ---'
        for f in /ops/*.view.sql; do
          [ -f "$$f" ] && [ -s "$$f" ] && psql -v ON_ERROR_STOP=1 -f "$$f" && echo "Applied $$f"
        done
        for f in /ops/*.fn.sql; do
          [ -f "$$f" ] && [ -s "$$f" ] && psql -v ON_ERROR_STOP=1 -f "$$f" && echo "Applied $$f"
        done
        echo '--- Installing pgTAP ---'
        apk add --no-cache build-base perl
        cd /tmp
        wget -q https://github.com/theory/pgtap/archive/v1.3.0.tar.gz
        tar -xzf v1.3.0.tar.gz
        cd pgtap-1.3.0
        make > /dev/null 2>&1
        DESTDIR=/tmp/pgtap-out make install > /dev/null 2>&1
        # Copy extension files to where the postgres *server* expects them,
        # but we can't — we're not in the server container.
        # Instead, load pgtap-static.sql directly into the remote DB.
        psql -v ON_ERROR_STOP=1 -f sql/pgtap-static.sql
        echo '--- Running pgTAP tests ---'
        PASS=0; FAIL=0
        for f in /tests/*.pgtap.sql; do
          echo "==> $$f"
          OUTPUT=$$(psql -v ON_ERROR_STOP=1 -f "$$f" 2>&1)
          echo "$$OUTPUT"
          # Parse TAP output: count "not ok" lines (TAP failures don't cause psql to exit non-zero)
          FILE_FAIL=$$(echo "$$OUTPUT" | grep -c '^not ok' || true)
          FILE_PASS=$$(echo "$$OUTPUT" | grep -c '^ok' || true)
          PASS=$$((PASS + FILE_PASS))
          FAIL=$$((FAIL + FILE_FAIL))
        done
        echo "--- TAP Results: $$PASS passed, $$FAIL failed ---"
        [ "$$FAIL" -eq 0 ]

volumes:
  postgres_data:
