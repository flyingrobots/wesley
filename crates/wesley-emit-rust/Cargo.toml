[package]
name = "wesley-emit-rust"
version = "0.1.0"
edition = "2021"
description = "Rust syntax-model emitter for Wesley IR"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/flyingrobots/wesley"
homepage = "https://github.com/flyingrobots/wesley#readme"
documentation = "https://docs.rs/wesley-emit-rust"
keywords = ["graphql", "compiler", "rust", "codegen"]
categories = ["compilers"]

[dependencies]
serde_json = "1.0"
wesley-core = { path = "../wesley-core", version = "0.1.0" }
wesley-emit-codec = { path = "../wesley-emit-codec", version = "0.1.0" }

[dev-dependencies]
pretty_assertions = "1.4"
syn = { version = "2.0", features = ["full"] }
