[package]
name = "wesley-emit-rust"
version = "0.1.0"
edition = "2021"
description = "AST-based Rust emitter for Wesley IR"
license = "Apache-2.0"
repository = "https://github.com/flyingrobots/wesley"
homepage = "https://github.com/flyingrobots/wesley#readme"
keywords = ["graphql", "compiler", "rust", "codegen"]
categories = ["compilers"]
publish = false

[dependencies]
wesley-core = { path = "../wesley-core", version = "0.1.0" }

[dev-dependencies]
pretty_assertions = "1.4"
syn = { version = "2.0", features = ["full"] }
