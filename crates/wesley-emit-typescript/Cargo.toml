[package]
name = "wesley-emit-typescript"
version = "0.1.0"
edition = "2021"
description = "AST-based TypeScript emitter for Wesley IR"
license = "Apache-2.0"
repository = "https://github.com/flyingrobots/wesley"
homepage = "https://github.com/flyingrobots/wesley#readme"
keywords = ["graphql", "compiler", "typescript", "codegen"]
categories = ["compilers"]
publish = false

[dependencies]
wesley-core = { path = "../wesley-core", version = "0.1.0" }

[dev-dependencies]
pretty_assertions = "1.4"
