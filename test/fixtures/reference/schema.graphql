# Example Wesley Schema
# GraphQL is the source of truth - everything else is generated

type User @wes_table {
  id: ID! @wes_pk @wes_default(expr: "gen_random_uuid()")
  email: String! @wes_unique @wes_index
  username: String @wes_unique
  display_name: String
  created_at: DateTime! @wes_default(expr: "now()")
  updated_at: DateTime! @wes_default(expr: "now()")
  
  # Virtual relations (no column created)
  posts: [Post!]! @hasMany
  comments: [Comment!]! @hasMany
}

type Post @wes_table {
  id: ID! @wes_pk @wes_default(expr: "gen_random_uuid()")
  user_id: ID! @wes_fk(ref: "User.id") @wes_index
  title: String!
  content: String
  published: Boolean! @wes_default(expr: "false")
  published_at: DateTime
  created_at: DateTime! @wes_default(expr: "now()")
  updated_at: DateTime! @wes_default(expr: "now()")
  
  # Virtual relations
  user: User! @hasOne
  comments: [Comment!]! @hasMany
  tags: [Tag!]! @hasMany
}

type Comment @wes_table {
  id: ID! @wes_pk @wes_default(expr: "gen_random_uuid()")
  post_id: ID! @wes_fk(ref: "Post.id") @wes_index
  user_id: ID! @wes_fk(ref: "User.id") @wes_index
  content: String!
  created_at: DateTime! @wes_default(expr: "now()")
  
  # Virtual relations
  post: Post! @hasOne
  user: User! @hasOne
}

type Tag @wes_table {
  id: ID! @wes_pk @wes_default(expr: "gen_random_uuid()")
  name: String! @wes_unique @wes_index
  slug: String! @wes_unique @wes_index
  created_at: DateTime! @wes_default(expr: "now()")
  
  # Virtual relations
  posts: [Post!]! @hasMany
}

