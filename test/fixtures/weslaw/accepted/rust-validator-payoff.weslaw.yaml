laws:
  - id: echo.scalar.positiveInt.u32-positive
    status: active
    kind: scalarSemantics
    subject: scalar:PositiveInt
    tags: [echo, scalar]
    semantics:
      representation: integer
      minInclusive: 1
      maxInclusive: 4294967295
      forbids: [silentGraphQLIntNarrowing]
    rationale: PositiveInt preserves a positive u32 domain across generated artifacts.
  - id: echo.variant.playback-mode
    status: active
    kind: variantLaw
    subject: input:PlaybackModeInput
    tags: [echo, variant]
    discriminator:
      field: kind
      enum: PlaybackModeKind
    cases:
      - value: PAUSED
        forbids: [target, then]
      - value: PLAY
        forbids: [target, then]
      - value: STEP_FORWARD
        forbids: [target, then]
      - value: STEP_BACK
        forbids: [target, then]
      - value: SEEK
        requires: [target, then]
