name: Feature Request
description: Propose a product-facing or capability-creating change.
title: '[feat] <short summary>'
labels:
  - feature
  - lane:inbox
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Frame feature work around sponsor actors, hills, and playbacks.
        GitHub Issues are Wesley's live Method tracker; labels are canonical
        lane, legend, and work metadata.

  - type: textarea
    id: requested_classification
    attributes:
      label: Requested classification
      description: Optional triage request. This does not set canonical labels.
      placeholder: |
        Suggested lane:
        Suggested legend:
        Suggested work type:

  - type: dropdown
    id: work_type
    attributes:
      label: Work type
      description: Choose the slice taxonomy for this issue.
      options:
        - product
        - enabler
        - integrity
    validations:
      required: true

  - type: textarea
    id: sponsor_actor
    attributes:
      label: Sponsor actor
      description: Whose job gets easier if this lands?
      placeholder: Release owner recovering a failed run
    validations:
      required: true

  - type: textarea
    id: sponsored_perspectives
    attributes:
      label: Sponsored perspectives
      description: Name abstract sponsored human and agent seats, not literal people or model brands.
      value: |
        - Sponsored Human: Name the served operator, maintainer, contributor, or user perspective.
        - Sponsored Agent: Name the automation, implementation, review, or reproducibility perspective.
    validations:
      required: true

  - type: textarea
    id: hill
    attributes:
      label: Hill
      description: One sentence describing the user-relevant outcome.
      placeholder: A release owner can resume a failed run and produce a trustworthy certificate without manual cleanup.
    validations:
      required: true

  - type: textarea
    id: playback
    attributes:
      label: Playback
      description: How will we demonstrate that the hill is real?
      placeholder: Run the affected Wesley command on a representative fixture and end with exact evidence.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong today?
    validations:
      required: true

  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed change
      description: What should Wesley do?
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Invariants to preserve
      description: List the runtime or product truths this must not violate.
      placeholder: |
        - schema/source truth remains sovereign
        - certified evidence remains exact-span and digest-backed
        - runtime ownership stays outside generic Wesley when applicable
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is explicitly out of scope?
      placeholder: |
        - No new remote execution mode
        - No new directive semantics
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance / tests
      description: What executable behavior should prove this is done?
      placeholder: |
        - [ ] Acceptance test covers the playback path.
        - [ ] Regression test covers the failure path.
        - [ ] Docs updated to reflect the shipped behavior.
    validations:
      required: true

  - type: textarea
    id: witness_plan
    attributes:
      label: Witness plan
      description: Expected evidence for tests, playback, docs, and closeout.
      value: |
        ### Tests
        Name the deterministic test command, failing-before-fix reproduction, or reason no code test applies.

        ### Playback
        Name the human-visible playback, demo, transcript, or reproduction that proves the result.

        ### Docs
        Name the documentation, issue template, signpost, or changelog surface updated, or explain why none is required.

        ### Retro / closeout
        Name the closeout note, follow-up issue links, or PR evidence that will preserve the decision.
    validations:
      required: true

  - type: textarea
    id: method_artifacts
    attributes:
      label: Method artifacts
      description: Fill these links as work proceeds.
      value: |
        - Design: Link `docs/design/<LEGEND>_<slug>.md`, or state why issue-only triage is sufficient.
        - Witness: Link committed witness evidence or the issue/PR comment that records verification.
        - Retro: Link the retro/closeout artifact or the issue close comment.
        - PR: Link the pull request before closing implementation work.
