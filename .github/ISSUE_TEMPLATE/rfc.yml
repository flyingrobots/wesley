name: RFC / Proposal
description: For larger design changes requiring discussion before implementation.
title: "[rfc] <short title>"
labels: ["rfc", "discussion"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        RFCs are for direction-setting changes. Frame them around the product hill,
        not just the mechanism.

  - type: textarea
    id: sponsor_actor
    attributes:
      label: Sponsor Actor
      description: Whose job improves if this design lands?
    validations:
      required: true

  - type: textarea
    id: hill
    attributes:
      label: Hill
      description: One sentence describing the user-relevant outcome.
    validations:
      required: true

  - type: textarea
    id: playback
    attributes:
      label: Playback
      description: What demonstration would prove this design is real?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why should Wesley do this?
    validations:
      required: true

  - type: textarea
    id: proposed_design
    attributes:
      label: Proposed Design
      description: Include diagrams, examples, and boundary decisions.
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Invariants To Preserve
      description: What truths and non-negotiables must survive this design?
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What is explicitly out of scope?
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs / Risks
      description: What could go wrong? What alternatives were rejected?
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: Rollout / Migration Plan
      description: How should this land incrementally?
    validations:
      required: false
