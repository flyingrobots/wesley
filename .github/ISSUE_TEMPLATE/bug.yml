name: Bug Report
description: Report a reproducible defect in shipped behavior.
title: '[bug] <short summary>'
labels: ['bug']
assignees: []
body:
  - type: textarea
    id: sponsor_actor
    attributes:
      label: Blocked Actor
      description: Who is blocked or harmed by this bug?
      placeholder: 'Release owner, maintainer, website user, or CI operator'
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Broken Behavior
      description: One sentence describing what is failing.
    validations:
      required: true

  - type: textarea
    id: playback
    attributes:
      label: Repro / Playback
      description: Exact steps, commands, or fixture path that reproduces the issue.
      placeholder: |
        1. Run `pnpm install`
        2. Run `pnpm wesley transform --schema ...`
        3. Observe failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include logs, stack traces, screenshots, or CI links.
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Invariant Violated
      description: Which truth or contract is being broken?
      placeholder: |
        - ledger truth
        - evidence truth
        - deterministic tests
        - local-first operation
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'OS, Node version, pnpm version, CI link, browser, fixture path'
    validations:
      required: true
