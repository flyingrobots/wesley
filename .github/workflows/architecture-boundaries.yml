name: Architecture Boundary Enforcement

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  enforce-boundaries:
    runs-on: ubuntu-latest
    name: Enforce Rust-Native Architecture Boundaries

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install pnpm (pinned)
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: |
          echo "Checking package architecture boundaries..."
          pnpm exec depcruise --config .dependency-cruiser.mjs packages/

      - name: Generate architecture diagram
        run: |
          echo "Generating architecture diagram..."
          pnpm exec depcruise --config .dependency-cruiser.mjs \
            --output-type archi packages/ > architecture.svg

      - name: Upload architecture diagram
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: architecture-diagram
          path: architecture.svg
          retention-days: 30

      - name: Validate retired Node packages stay retired
        run: |
          set -euo pipefail
          retired=(
            packages/wesley-core/package.json
            packages/wesley-cli/package.json
            packages/wesley-host-node/package.json
            packages/wesley-runtime-node/package.json
          )

          for package_manifest in "${retired[@]}"; do
            if [ -e "$package_manifest" ]; then
              echo "Retired legacy package returned: $package_manifest" >&2
              exit 1
            fi
          done

      - name: Validate retained package imports
        run: |
          set -euo pipefail
          if grep -RIl --include='*.mjs' --include='*.ts' \
            -E "@wesley/(core|cli|runtime-node)|wesley-host-node|packages/wesley-(core|cli|host-node|runtime-node)" \
            packages scripts | grep -v '^scripts/preflight.mjs$' | grep .; then
            echo "Retired legacy package import or executable reference found." >&2
            exit 1
          fi

      - name: Generate boundary report
        if: always()
        run: |
          cat > boundary-report.md << 'EOF'
          # Architecture Boundary Report

          ## Rust-Native Front Door Status

          ### Completed

          - The product front door is the Rust `wesley` binary.
          - Legacy JS compiler authority packages are retired.
          - Holmes remains a self-contained assurance package, not compiler authority.
          - Browser, Bun, and Deno packages remain external host experiments without JS core/runtime imports.

          ### Retired Package Guard

          The workflow fails if any of these manifests return:

          - `packages/wesley-core/package.json`
          - `packages/wesley-cli/package.json`
          - `packages/wesley-host-node/package.json`
          - `packages/wesley-runtime-node/package.json`

          Generated at: $(date)
          EOF

      - name: Upload boundary report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-report
          path: boundary-report.md
          retention-days: 90
