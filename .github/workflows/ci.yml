name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    name: Workspace compatibility plus Rust product smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      # Install Bats for CLI tests executed in this workflow
      - name: Install Bats
        uses: ./.github/actions/install-bats

      - run: pnpm -w test

      # Rust product and repo-level Bats checks cover the retained front door.

      - name: Rust product native schema lower smoke
        run: |
          cargo run --bin wesley -- schema lower \
            --schema test/fixtures/examples/ecommerce.graphql \
            --json > "$RUNNER_TEMP/ecommerce-l1.json"

      # Every suite runs on every change, including the two that start a local
      # server: all sixteen take under a minute. A path filter once let a broken
      # suite through, and a suite nothing ran was failing on main unnoticed.
      - name: Repo Bats tests (every suite)
        env:
          BATS_LIB_PATH: test/vendor
          TERM: xterm
          BATS_NO_COLOR: '1'
        run: |
          set -euo pipefail
          ran=0
          for f in test/*.bats; do
            echo "Running Bats: $f"
            timeout 3m bats -t "$f"
            ran=$((ran + 1))
          done
          # A glob that matches nothing must not pass as success.
          if [ "$ran" -eq 0 ]; then
            echo "No Bats suites ran."
            exit 1
          fi
          echo "Ran $ran Bats suites."
