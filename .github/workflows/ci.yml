name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    name: Workspace compatibility plus Rust product smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      # Install Bats for CLI tests executed in this workflow
      - name: Install Bats
        uses: ./.github/actions/install-bats

      - run: pnpm -w test

      # Rust product and repo-level Bats checks cover the retained front door.

      - name: Rust product native schema lower smoke
        run: |
          cargo run --bin wesley -- schema lower \
            --schema test/fixtures/examples/ecommerce.graphql \
            --json > "$RUNNER_TEMP/ecommerce-l1.json"

      - name: Detect changes for repo Bats tests (no servers)
        id: changelog
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RANGE="${BEFORE}..${SHA}"
          if [ "$EVENT" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
            RANGE="${BASE_REF}..${SHA}"
          fi
          echo "Diff range: $RANGE"
          CHANGED=$(git diff --name-only "$RANGE" || true)
          echo "$CHANGED" | sed 's/^/ - /'
          NEED=false
          # Trigger only on unit/serverless repository checks.
          echo "$CHANGED" | grep -E -q '^(scripts/serve-static\.mjs|test/serve-static-(unit|relative-unit)\.bats|scripts/generate-ir-fixtures\.mjs|test/docs-planning-boundary\.bats|test/domain-empty-boundary\.bats|test/ir-fixtures\.bats|test/ci-)' && NEED=true || true
          echo "RUN_BATS=$NEED" >> $GITHUB_ENV

      - name: Repo Bats tests (unit/docs/ci checks only)
        if: ${{ env.RUN_BATS == 'true' }}
        env:
          BATS_LIB_PATH: test/vendor
          TERM: xterm
          BATS_NO_COLOR: '1'
        run: |
          set -euo pipefail
          files=(
            test/serve-static-unit.bats
            test/serve-static-relative-unit.bats
            test/docs-planning-boundary.bats
            test/domain-empty-boundary.bats
            test/ir-fixtures.bats
            test/ci-package-manager-policy.bats
            test/ci-workflows.bats
          )
          for f in "${files[@]}"; do
            echo "Running Bats: $f"
            timeout 3m bats -t "$f"
          done
