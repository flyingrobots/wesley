name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    name: Workspace compatibility plus Rust product smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      # Install Bats for CLI tests executed in this workflow
      - name: Install Bats
        uses: ./.github/actions/install-bats

      - run: pnpm -w test

      # Rust product and repo-level Bats checks cover the retained front door.

      - name: Rust product native schema lower smoke
        run: |
          cargo run --bin wesley -- schema lower \
            --schema test/fixtures/examples/ecommerce.graphql \
            --json > "$RUNNER_TEMP/ecommerce-l1.json"

      # Every suite runs on every change, including the two that start a local
      # server: all sixteen take under a minute. A path filter once let a broken
      # suite through, and a suite nothing ran was failing on main unnoticed.
      - name: Repo Bats tests (every suite)
        env:
          BATS_LIB_PATH: test/vendor
          TERM: xterm
          BATS_NO_COLOR: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          ran=0
          for f in test/*.bats; do
            echo "Running Bats: $f"
            timeout 3m bats -t "$f"
            ran=$((ran + 1))
          done
          # A glob that matches nothing must not pass as success.
          if [ "$ran" -eq 0 ]; then
            echo "No Bats suites ran."
            exit 1
          fi
          echo "Ran $ran Bats suites."
