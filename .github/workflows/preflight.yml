name: Repository Hygiene - Preflight

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preflight:
    name: Repository hygiene preflight
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      # legacy-preflight lints the workflows and fails here if the linter is
      # missing. Built from a pinned version with the Go toolchain the runner
      # already has; the module checksum database verifies what is fetched.
      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run repository hygiene preflight
        run: pnpm run legacy-preflight
