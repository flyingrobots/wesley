name: Docs Link Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check markdown links (relative only)
        run: node scripts/check-doc-links.mjs
      - name: Check docs truth manifest
        run: node scripts/check-doc-truth.mjs
