name: Docs Link Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Check markdown links (relative only)
        run: node scripts/check-doc-links.mjs
      - name: Check docs truth manifest
        run: node scripts/check-doc-truth.mjs
