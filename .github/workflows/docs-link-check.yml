name: Docs Link Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check markdown links (relative only)
        run: node scripts/check-doc-links.mjs
