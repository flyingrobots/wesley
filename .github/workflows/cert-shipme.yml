name: SHIPME Certificate

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/prepare-shipme-cert-fixture.mjs'
      - '.github/**'
      - '.github/workflows/cert-shipme.yml'

permissions:
  contents: read

jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare passing SHIPME certificate fixture
        run: node scripts/prepare-shipme-cert-fixture.mjs

      - name: Run HOLMES investigation
        run: |
          node packages/wesley-holmes/src/cli.mjs investigate \
            --bundle-dir .wesley-cache \
            --json .wesley-cache/holmes-report.json \
            > .wesley-cache/holmes-report.md

      - name: Create SHIPME
        run: |
          cat > SHIPME.md <<EOF
          # SHIPME

          Environment: production
          Verdict: PASS
          Evidence: .wesley-cache/holmes-report.json
          Commit: ${GITHUB_SHA}
          EOF

      - name: Upload SHIPME
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SHIPME
          path: SHIPME.md
