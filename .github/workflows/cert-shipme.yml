name: SHIPME Certificate

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/prepare-shipme-cert-fixture.mjs'
      - '.github/**'
      - '.github/workflows/cert-shipme.yml'

permissions:
  contents: read

jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare passing SHIPME certificate fixture
        run: node scripts/prepare-shipme-cert-fixture.mjs

      - name: Run HOLMES investigation
        run: |
          node packages/wesley-holmes/src/cli.mjs investigate \
            --bundle-dir .wesley-cache \
            --json .wesley-cache/holmes-report.json \
            > .wesley-cache/holmes-report.md

      - name: Create SHIPME
        run: |
          cat > SHIPME.md <<EOF
          # SHIPME

          Environment: production
          Verdict: PASS
          Evidence: .wesley-cache/holmes-report.json
          Commit: ${GITHUB_SHA}
          EOF

      - name: Upload SHIPME
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SHIPME
          path: SHIPME.md
