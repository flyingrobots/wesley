name: SHIPME Certificate

on:
  push:
    branches: [ main, dev, 'feat/*', 'fix/*', 'milestone/*' ]
    paths:
      - 'packages/**'
      - '.github/**'
      - '.github/workflows/cert-shipme.yml'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/**'
      - '.github/workflows/cert-shipme.yml'

permissions:
  contents: read

jobs:
  cert:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    services:
      postgres:
        image: postgres:15@sha256:c635fa3e3b7421a659d34abdfd6d492f679cbe8149e261a501237b55c5a94212
        env:
          POSTGRES_USER: wesley
          POSTGRES_PASSWORD: wesley_test
          POSTGRES_DB: wesley_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wesley -d wesley_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile

      - name: Transform
        run: node packages/wesley-host-node/bin/wesley.mjs transform --schema test/fixtures/blade/schema-v1.graphql --emit-bundle --out-dir out

      - name: Plan (write)
        run: node packages/wesley-host-node/bin/wesley.mjs plan --schema test/fixtures/blade/schema-v1.graphql --write --out-dir out

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            pg_isready -h localhost -U wesley -d wesley_test && break
            sleep 1
          done
        env:
          PGPASSWORD: wesley_test

      - name: Rehearse (REALM)
        run: node packages/wesley-host-node/bin/wesley.mjs rehearse --schema test/fixtures/blade/schema-v1.graphql --dsn postgres://wesley:wesley_test@localhost:5432/wesley_test --timeout 300000

      - name: Run HOLMES investigation
        run: |
          node packages/wesley-holmes/src/cli.mjs investigate \
            --bundle-dir .wesley-cache \
            --json .wesley-cache/holmes-report.json \
            > .wesley-cache/holmes-report.md

      - name: Create SHIPME
        run: node packages/wesley-host-node/bin/wesley.mjs cert-create --env production --out SHIPME.md

      - name: Generate keypair
        run: |
          node -e "const {generateKeyPairSync}=require('crypto');const {writeFileSync}=require('fs');const {privateKey, publicKey}=generateKeyPairSync('ed25519'); writeFileSync('priv.pem', privateKey.export({type:'pkcs8',format:'pem'})); writeFileSync('pub.pem', publicKey.export({type:'spki',format:'pem'}));"

      - name: Sign SHIPME
        run: node packages/wesley-host-node/bin/wesley.mjs cert-sign --in SHIPME.md --key priv.pem --signer HOLMES

      - name: Verify SHIPME
        run: node packages/wesley-host-node/bin/wesley.mjs cert-verify --in SHIPME.md --pub pub.pem

      - name: Upload SHIPME
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: SHIPME
          path: SHIPME.md

      - name: Post SHIPME badge to PR
        if: github.event_name == 'pull_request'
        id: badge
        run: |
          echo "BADGE=$(node packages/wesley-host-node/bin/wesley.mjs cert-badge --in SHIPME.md)" >> $GITHUB_OUTPUT

      - name: Wait for HOLMES suite comment
        if: github.event_name == 'pull_request'
        id: holmes_comment_wait
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const marker = `<!-- HOLMES_SUITE_SHA:${context.sha} -->`;
            const started = Date.now();
            const workflowId = 'wesley-holmes.yml';
            const timeoutMs = 2 * 60 * 60 * 1000;
            const pollIntervalMs = 15 * 1000;
            const maxNoRunFound = 20;
            let noRunFoundCount = 0;

            while (Date.now() - started < timeoutMs) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

              const holmesComment = comments.find(
                (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
              );

              if (holmesComment) {
                core.setOutput('ready', 'true');
                return;
              }

              const workflowRunsResponse = await github.request(
                'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowId,
                  event: 'pull_request',
                  head_sha: context.sha,
                  per_page: 20
                }
              );

              const currentRun = workflowRunsResponse.data.workflow_runs
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];

              if (!currentRun) {
                noRunFoundCount += 1;
                if (noRunFoundCount > maxNoRunFound) {
                  core.setOutput('ready', 'false');
                  core.setFailed(`No wesley-holmes.yml run found for ${context.sha} after ${maxNoRunFound} polls.`);
                  return;
                }

                await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
                continue;
              }

              noRunFoundCount = 0;

              if (currentRun?.status === 'completed') {
                core.setOutput('ready', 'false');
                core.setFailed(
                  `HOLMES suite workflow ${currentRun.id} for ${context.sha} finished with conclusion ${currentRun.conclusion || 'unknown'} before posting the Holmes PR comment.`
                );
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
            }

            core.setOutput('ready', 'false');
            core.setFailed(`HOLMES suite comment for ${context.sha} did not appear within the 2 hour coordination window.`);
      
      - name: Create/Update PR Comment
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && steps.holmes_comment_wait.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const badge = process.env.BADGE || '${{ steps.badge.outputs.BADGE }}';
            const marker = '<!-- SHIPME_COMMENT -->';
            const body = `${marker}\n### 🚢 SHIPME\n\n${badge}\n`;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const botComment = comments.find(
                (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
              );
              if (botComment) {
                await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
              }
            } catch (error) {
              core.warning(`Could not post SHIPME badge to PR: ${error.message}`);
            }
