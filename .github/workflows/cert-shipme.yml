name: SHIPME Certificate

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/prepare-shipme-cert-fixture.mjs'
      - '.github/**'
      - '.github/workflows/cert-shipme.yml'

permissions:
  contents: read

jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Prepare passing SHIPME certificate fixture
        run: node scripts/prepare-shipme-cert-fixture.mjs

      - name: Run HOLMES investigation
        run: |
          node packages/wesley-holmes/src/cli.mjs investigate \
            --bundle-dir .wesley-cache \
            --json .wesley-cache/holmes-report.json \
            > .wesley-cache/holmes-report.md

      - name: Create SHIPME
        run: |
          cat > SHIPME.md <<EOF
          # SHIPME

          Environment: production
          Verdict: PASS
          Evidence: .wesley-cache/holmes-report.json
          Commit: ${GITHUB_SHA}
          EOF

      - name: Upload SHIPME
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SHIPME
          path: SHIPME.md
