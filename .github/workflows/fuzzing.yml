name: Property Fuzzing

on:
  push:
    branches: ["**"]
    paths:
      - 'packages/wesley-core/test/fuzz/**'
      - 'packages/wesley-core/package.json'
      - 'packages/wesley-core/test/run-all-tests.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: ["**"]
    paths:
      - 'packages/wesley-core/test/fuzz/**'
      - 'packages/wesley-core/package.json'
      - 'packages/wesley-core/test/run-all-tests.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788
        with:
          version: 9.15.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Property-based fuzzing with fast-check
        run: pnpm --filter @wesley/core test:fuzz
