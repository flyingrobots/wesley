name: pkg-core

on:
  push:
    branches: ['**']
    paths:
      - 'packages/wesley-core/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    branches: ['**']
    paths:
      - 'packages/wesley-core/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 9.15.9
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: '@wesley/core tests (coverage)'
        # Quote the command: '@' can confuse YAML if unquoted
        run: 'pnpm --filter @wesley/core test:coverage || pnpm --filter @wesley/core test'
      - name: Upload core coverage (if present)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: core-coverage
          path: packages/wesley-core/coverage/**
          if-no-files-found: ignore
