name: pkg-core

on:
  push:
    branches: ['**']
    paths:
      - 'packages/wesley-core/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    branches: ['**']
    paths:
      - 'packages/wesley-core/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 9.15.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: '@wesley/core tests (coverage)'
        # Quote the command: '@' can confuse YAML if unquoted
        run: 'pnpm --filter @wesley/core test:coverage || pnpm --filter @wesley/core test'
      - name: Upload core coverage (if present)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-coverage
          path: packages/wesley-core/coverage/**
          if-no-files-found: ignore
