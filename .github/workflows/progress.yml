name: progress-matrix

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'meta/progress.config.json'
      - 'scripts/compute-progress.mjs'
      - 'README.md'

jobs:
  compute-progress:
    runs-on: ubuntu-latest
    env:
      PROGRESS_PR_TOKEN: ${{ secrets.PROGRESS_PR_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 9.15.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: Compute progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute-progress.mjs
      - name: Create progress PR
        if: ${{ env.PROGRESS_PR_TOKEN != '' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ env.PROGRESS_PR_TOKEN }}
          commit-message: 'docs(progress): update package matrix and progress.json'
          title: 'docs(progress): update package matrix and progress.json'
          body: 'Automated update of Package Matrix and meta/progress.json.'
          branch: progress/update-matrix
          delete-branch: true
