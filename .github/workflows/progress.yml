name: progress-matrix

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'meta/progress.config.json'
      - 'scripts/compute-progress.mjs'
      - 'README.md'

jobs:
  compute-progress:
    runs-on: ubuntu-latest
    env:
      PROGRESS_PR_TOKEN: ${{ secrets.PROGRESS_PR_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53
        with:
          version: 9.15.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: Generate coverage for core (for gating)
        run: pnpm --filter @wesley/core test:coverage || true
      - name: Compute progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute-progress.mjs
      - name: Create progress PR
        if: ${{ env.PROGRESS_PR_TOKEN != '' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ env.PROGRESS_PR_TOKEN }}
          commit-message: 'docs(progress): update package matrix and progress.json'
          title: 'docs(progress): update package matrix and progress.json'
          body: 'Automated update of Package Matrix and meta/progress.json.'
          branch: progress/update-matrix
          delete-branch: true
