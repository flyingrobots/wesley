name: pkg-host-deno

on:
  push:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-deno/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-deno/**'

concurrency:
  group: pkg-host-deno-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-host:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb
        with:
          version: '9.15.9'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Deno host smoke
        run: deno run -A packages/wesley-host-deno/examples/smoke.ts | tee deno-host.out && grep -q '^DENO_HOST_OK:' deno-host.out
