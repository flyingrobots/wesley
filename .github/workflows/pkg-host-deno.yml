name: External Host Experiment - pkg-host-deno

on:
  push:
    branches: ['**']
    paths:
      - 'packages/wesley-host-deno/**'
  pull_request:
    branches: ['**']
    paths:
      - 'packages/wesley-host-deno/**'

concurrency:
  group: pkg-host-deno-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-host:
    name: External host experiment - host-deno package
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: '9.15.9'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Deno host smoke
        run: deno run -A packages/wesley-host-deno/examples/smoke.ts | tee deno-host.out && grep -q '^DENO_HOST_OK:' deno-host.out
