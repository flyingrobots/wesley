name: pkg-host-deno

on:
  push:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-deno/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-deno/**'

concurrency:
  group: pkg-host-deno-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deno-host:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno host smoke
        run: deno run -A packages/wesley-host-deno/examples/smoke.ts | tee deno-host.out && grep -q '^DENO_HOST_OK:' deno-host.out
