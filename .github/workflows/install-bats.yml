name: install-bats

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit
      - name: Install bats and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
