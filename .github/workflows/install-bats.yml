name: install-bats

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450
        with:
          egress-policy: audit
      - name: Install bats and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
