name: Release Crates

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main --tags --prune
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Tag ${GITHUB_REF_NAME} points at $tag_commit, but HEAD is $head_commit"
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release-guard --tag "$GITHUB_REF_NAME"

      - name: Check for open version issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          issue_query() {
            gh issue list "$@" \
              --state open \
              --json number,title,url \
              --jq '.[] | "#\(.number) \(.title) \(.url)"'
          }
          matches="$(
            {
              issue_query --search "\"${GITHUB_REF_NAME}\" OR \"${version}\" repo:${GITHUB_REPOSITORY}"
              issue_query --milestone "${GITHUB_REF_NAME}" 2>/dev/null || true
              issue_query --milestone "${version}" 2>/dev/null || true
              issue_query --label "${GITHUB_REF_NAME}" 2>/dev/null || true
              issue_query --label "${version}" 2>/dev/null || true
            } | sort -u
          )"
          if [ -n "$matches" ]; then
            echo "Open GitHub issues are associated with ${GITHUB_REF_NAME}:"
            echo "$matches"
            exit 1
          fi

      - name: Docs check
        run: cargo xtask docs-check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo test
        run: cargo test --workspace --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release check
        run: cargo xtask release-check

      - name: Cargo audit
        run: cargo audit

      - name: Package sanity
        run: cargo xtask package-crates --tag "$GITHUB_REF_NAME"

  publish-crates:
    needs: release-gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Verify registry credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is required to publish crates"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --prune
          cargo xtask release-guard --tag "$GITHUB_REF_NAME"

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$version" '
            $0 ~ "^## \\[v?" version "\\]" { in_section=1; print; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "No CHANGELOG.md section found for ${version}"
            exit 1
          fi

      - name: Classify release channel
        run: |
          set -euo pipefail
          # A SemVer pre-release (e.g. v0.3.0-alpha.1) carries a hyphen after the
          # core version. Stable releases (v0.3.0) do not.
          if printf '%s' "${GITHUB_REF_NAME#v}" | grep -q '-'; then
            echo "WESLEY_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "WESLEY_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          draft_state_file="${RUNNER_TEMP}/release-draft-state.txt"
          channel_flags=(--latest)
          if [ "${WESLEY_PRERELEASE}" = "true" ]; then
            channel_flags=(--prerelease --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$draft_state_file" 2>/dev/null; then
            if [ "$(cat "$draft_state_file")" != "true" ]; then
              echo "Release ${GITHUB_REF_NAME} already exists and is not a draft"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file" --draft "${channel_flags[@]}" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$notes_file" "${channel_flags[@]}" --verify-tag
          fi

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo xtask publish-crates --tag "$GITHUB_REF_NAME" --execute --skip-checks

      - name: Verify crates.io visibility
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for crate in wesley-core wesley-emit-codec wesley-emit-rust wesley-emit-typescript wesley-cli; do
            for attempt in $(seq 1 30); do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "${crate}@${version} did not become visible on crates.io in time" >&2
                exit 1
              fi
              sleep 10
            done
          done

      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel_flags=(--latest)
          if [ "${WESLEY_PRERELEASE}" = "true" ]; then
            channel_flags=(--prerelease --latest=false)
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "${channel_flags[@]}" --verify-tag
