name: pkg-host-bun

on:
  push:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-bun/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-bun/**'

permissions:
  contents: read

jobs:
  bun-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.20
      - name: Bun host smoke
        run: bun run packages/wesley-host-bun/examples/smoke.mjs | tee bun-host.out && grep -q '^BUN_HOST_OK:' bun-host.out
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
