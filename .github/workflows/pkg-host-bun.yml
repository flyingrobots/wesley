name: pkg-host-bun

on:
  push:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-bun/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'packages/wesley-host-bun/**'

permissions:
  contents: read

jobs:
  bun-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.2.20
      - name: Bun host smoke
        run: bun run packages/wesley-host-bun/examples/smoke.mjs | tee bun-host.out && grep -q '^BUN_HOST_OK:' bun-host.out
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
