name: External Host Experiment - pkg-host-bun

on:
  push:
    branches: ['**']
    paths:
      - 'packages/wesley-host-bun/**'
  pull_request:
    branches: ['**']
    paths:
      - 'packages/wesley-host-bun/**'

permissions:
  contents: read

jobs:
  bun-host:
    name: External host experiment - host-bun package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.20
      - name: Bun host smoke
        run: bun run packages/wesley-host-bun/examples/smoke.mjs | tee bun-host.out && grep -q '^BUN_HOST_OK:' bun-host.out
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
