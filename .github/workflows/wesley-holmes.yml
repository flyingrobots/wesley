name: 🔍 Wesley + SHA-lock HOLMES CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  HOLMES_BUNDLE_DIR: test/fixtures/examples/.wesley-cache
  HOLMES_SCHEMA: test/fixtures/examples/ecommerce.graphql
  HOLMES_OUT_DIR: out
  HOLMES_ARTIFACT: wesley-bundle

permissions:
  contents: read

jobs:
  detect-schema-sets:
    name: '🧭 Detect Schema Sets'
    runs-on: ubuntu-latest
    outputs:
      schema_sets: ${{ steps.detect.outputs.schema_sets }}
      selected_count: ${{ steps.detect.outputs.selected_count }}
      comment_mode: ${{ steps.detect.outputs.comment_mode }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: '📦 Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: '🧭 Detect Schema Sets'
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_file="$RUNNER_TEMP/wesley-changed-files.txt"
          : > "$changed_file"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file" || true
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$changed_file" || true
          fi

          manifest_status=0
          cargo run --bin wesley -- config inspect --json > "$RUNNER_TEMP/wesley-manifest.json" 2> "$RUNNER_TEMP/wesley-manifest.err" || manifest_status=$?

          if [ "$manifest_status" -eq 0 ]; then
            cargo run --bin wesley -- config changed-schemas \
              --changed-file "$changed_file" \
              --json > "$RUNNER_TEMP/wesley-selected.json"
            comment_mode="$(node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/wesley-manifest.json', 'utf8'));
          process.stdout.write(report.manifest.commentMode || 'update');
          NODE
          )"
            node <<'NODE' > "$RUNNER_TEMP/wesley-schema-sets.json"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/wesley-selected.json', 'utf8'));
          const sets = (report.selectedSchemaPaths || []).map((schema) => ({
            id: schema.id,
            schema: schema.path,
            bundle_dir: schema.bundleDir
          }));
          process.stdout.write(JSON.stringify(sets));
          NODE
          else
            if ! grep -Fq "no Wesley manifest found" "$RUNNER_TEMP/wesley-manifest.err"; then
              echo "Wesley manifest discovery failed; refusing legacy fallback" >&2
              cat "$RUNNER_TEMP/wesley-manifest.err" >&2 || true
              exit "$manifest_status"
            fi
            echo "No Wesley manifest found; falling back to legacy schema detection" >&2
            cat "$RUNNER_TEMP/wesley-manifest.err" >&2 || true
            if [ -n "${WESLEY_SCHEMA:-}" ] && [ -f "$WESLEY_SCHEMA" ]; then
              schema="$WESLEY_SCHEMA"
            elif [ -n "${HOLMES_SCHEMA:-}" ] && [ -f "$HOLMES_SCHEMA" ]; then
              schema="$HOLMES_SCHEMA"
            else
              mapfile -t files < <(git ls-files "**/*.graphql" 2>/dev/null || true)
              picked=""
              if [ ${#files[@]} -gt 0 ]; then
                for f in "${files[@]}"; do
                  if [ "${f##*/}" = "schema.graphql" ]; then picked="$f"; break; fi
                done
                if [ -z "$picked" ]; then picked="${files[0]}"; fi
              fi
              schema="${picked:-$HOLMES_SCHEMA}"
            fi
            base_dir="$(dirname "$schema")"
            bundle_dir="$base_dir/.wesley-cache"
            comment_mode="update"
            SCHEMA="$schema" BUNDLE_DIR="$bundle_dir" \
              node -e 'process.stdout.write(JSON.stringify([{id:"default",schema:process.env.SCHEMA,bundle_dir:process.env.BUNDLE_DIR}]))' \
              > "$RUNNER_TEMP/wesley-schema-sets.json"
          fi

          selected_count="$(jq 'length' "$RUNNER_TEMP/wesley-schema-sets.json")"
          echo "Selected schema sets: $selected_count"
          jq -r '.[] | " - \(.id): \(.schema) -> \(.bundle_dir)"' "$RUNNER_TEMP/wesley-schema-sets.json"
          {
            echo 'schema_sets<<JSON'
            cat "$RUNNER_TEMP/wesley-schema-sets.json"
            echo
            echo 'JSON'
            echo "selected_count=$selected_count"
            echo "comment_mode=$comment_mode"
          } >> "$GITHUB_OUTPUT"

      - name: '📤 Upload Dashboard Template'
        if: ${{ steps.detect.outputs.selected_count != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-template
          path: docs/holmes-dashboard
          if-no-files-found: error

  wesley-generate:
    name: '🚀 Wesley Generation'
    runs-on: ubuntu-latest
    needs: detect-schema-sets
    if: ${{ needs.detect-schema-sets.outputs.selected_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        schema_set: ${{ fromJson(needs.detect-schema-sets.outputs.schema_sets) }}

    steps:
      - name: Harden runner

        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920

        with:
          egress-policy: audit
      - name: '📦 Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: '🛠️ Setup HOLMES environment'
        uses: ./.github/actions/holmes-setup
        with:
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}
          schema: ${{ matrix.schema_set.schema }}
          out-dir: ${{ env.HOLMES_OUT_DIR }}
          artifact-name: ${{ env.HOLMES_ARTIFACT }}-${{ matrix.schema_set.id }}
          cache-namespace: ${{ matrix.schema_set.id }}
          always-generate: 'true'

      - name: '📊 Display Scores'
        run: |
          echo "## 📊 Generation Scores"
          if [ -f "${{ matrix.schema_set.bundle_dir }}/scores.json" ]; then
            cat "${{ matrix.schema_set.bundle_dir }}/scores.json" | jq '.scores'
          else
            echo "No scores.json found yet"
          fi

      - name: '📦 Prepare Bundle for Upload'
        run: |
          ls -la "${{ matrix.schema_set.bundle_dir }}"
          test -f "${{ matrix.schema_set.bundle_dir }}/bundle.json"

      - name: '💾 Upload Bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.HOLMES_ARTIFACT }}-${{ matrix.schema_set.id }}
          path: |
            ${{ matrix.schema_set.bundle_dir }}/bundle.json
            ${{ matrix.schema_set.bundle_dir }}/scores.json
            ${{ matrix.schema_set.bundle_dir }}/history.json
          if-no-files-found: error

  holmes-investigate:
    name: '🔍 HOLMES Investigation'
    runs-on: ubuntu-latest
    needs: [detect-schema-sets, wesley-generate]
    if: ${{ needs.detect-schema-sets.outputs.selected_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        schema_set: ${{ fromJson(needs.detect-schema-sets.outputs.schema_sets) }}

    steps:
      - name: Harden runner

        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920

        with:
          egress-policy: audit
      - name: '📦 Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: '🛠️ Setup HOLMES environment'
        uses: ./.github/actions/holmes-setup
        with:
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}
          schema: ${{ matrix.schema_set.schema }}
          out-dir: ${{ env.HOLMES_OUT_DIR }}
          artifact-name: ${{ env.HOLMES_ARTIFACT }}-${{ matrix.schema_set.id }}
          cache-namespace: ${{ matrix.schema_set.id }}

      - name: '🔍 Run Investigation'
        id: holmes
        uses: ./.github/actions/run-holmes-command
        with:
          command: investigate
          report-name: holmes
          schema-path: ${{ matrix.schema_set.schema }}
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}

      - name: '📚 Scope Report'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "reports-by-schema/${{ matrix.schema_set.id }}"
          cp -R reports/holmes "reports-by-schema/${{ matrix.schema_set.id }}/"

      - name: '💾 Save Report'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: holmes-report-${{ matrix.schema_set.id }}
          path: reports-by-schema/${{ matrix.schema_set.id }}
          if-no-files-found: error

  watson-verify:
    name: '🩺 WATSON Verification'
    runs-on: ubuntu-latest
    needs: [detect-schema-sets, wesley-generate, holmes-investigate]
    if: ${{ needs.detect-schema-sets.outputs.selected_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        schema_set: ${{ fromJson(needs.detect-schema-sets.outputs.schema_sets) }}

    steps:
      - name: Harden runner

        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920

        with:
          egress-policy: audit
      - name: '📦 Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: '🛠️ Setup HOLMES environment'
        uses: ./.github/actions/holmes-setup
        with:
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}
          schema: ${{ matrix.schema_set.schema }}
          out-dir: ${{ env.HOLMES_OUT_DIR }}
          artifact-name: ${{ env.HOLMES_ARTIFACT }}-${{ matrix.schema_set.id }}
          cache-namespace: ${{ matrix.schema_set.id }}

      - name: '🩺 Run Verification'
        id: watson
        uses: ./.github/actions/run-holmes-command
        with:
          command: verify
          report-name: watson
          schema-path: ${{ matrix.schema_set.schema }}
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}

      - name: '📚 Scope Report'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "reports-by-schema/${{ matrix.schema_set.id }}"
          cp -R reports/watson "reports-by-schema/${{ matrix.schema_set.id }}/"

      - name: '💾 Save Report'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watson-report-${{ matrix.schema_set.id }}
          path: reports-by-schema/${{ matrix.schema_set.id }}
          if-no-files-found: error

  moriarty-predict:
    name: '🔮 MORIARTY Predictions'
    runs-on: ubuntu-latest
    needs: [detect-schema-sets, wesley-generate, watson-verify]
    if: ${{ needs.detect-schema-sets.outputs.selected_count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        schema_set: ${{ fromJson(needs.detect-schema-sets.outputs.schema_sets) }}

    steps:
      - name: Harden runner

        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920

        with:
          egress-policy: audit
      - name: '📦 Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: '🛠️ Setup HOLMES environment'
        uses: ./.github/actions/holmes-setup
        with:
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}
          schema: ${{ matrix.schema_set.schema }}
          out-dir: ${{ env.HOLMES_OUT_DIR }}
          artifact-name: ${{ env.HOLMES_ARTIFACT }}-${{ matrix.schema_set.id }}
          cache-namespace: ${{ matrix.schema_set.id }}
          always-generate: 'true'

      - name: '🔄 Ensure history for MORIARTY'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --is-shallow-repository >/dev/null 2>&1; then
            git fetch --prune --unshallow --tags || true
          fi
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' || true

      - name: '🧮 Compute MORIARTY context (issues/PRs/CI)'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        continue-on-error: true
        env:
          BUNDLE_DIR: ${{ matrix.schema_set.bundle_dir }}
          BASE_REF: ${{ github.base_ref }}
          TIMEFRAME_HOURS: 168
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const baseRef = process.env.BASE_REF || 'main';
            const hours = Number(process.env.TIMEFRAME_HOURS || '168');
            const since = new Date(Date.now() - hours*3600*1000);
            const sinceIso = since.toISOString();

            async function countClosedIssuesSince() {
              let page = 1, per_page = 100, count = 0;
              while (page <= 3) {
                const { data } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed',
                  since: sinceIso,
                  per_page,
                  page
                });
                if (!data || data.length === 0) break;
                for (const item of data) {
                  if (!item.pull_request && item.closed_at && new Date(item.closed_at) >= since) count++;
                }
                if (data.length < per_page) break;
                page++;
              }
              return count;
            }

            async function countMergedPRsSince() {
              let page = 1, per_page = 100, count = 0;
              while (page <= 3) {
                const { data } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed',
                  base: baseRef,
                  per_page,
                  page
                });
                if (!data || data.length === 0) break;
                for (const pr of data) {
                  if (pr.merged_at && new Date(pr.merged_at) >= since) count++;
                }
                if (data.length < per_page) break;
                page++;
              }
              return count;
            }

            async function computeCIStability() {
              let page = 1, per_page = 100, runs = 0, success = 0;
              while (page <= 3) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: baseRef,
                  per_page,
                  page
                });
                if (!data || !data.workflow_runs || data.workflow_runs.length === 0) break;
                for (const run of data.workflow_runs) {
                  const created = new Date(run.created_at);
                  if (created < since) continue;
                  runs++;
                  if (run.conclusion === 'success') success++;
                }
                if (data.workflow_runs.length < per_page) break;
                page++;
              }
              const stability = runs > 0 ? success / runs : null;
              return { branch: baseRef, runsConsidered: runs, successes: success, stability, since: sinceIso };
            }

            const [issuesClosed, prsMerged, ci] = await Promise.all([
              countClosedIssuesSince(),
              countMergedPRsSince(),
              computeCIStability()
            ]);

            const out = {
              generatedAt: new Date().toISOString(),
              timeframeHours: hours,
              baseRef,
              issuesClosed,
              prsMerged,
              ci
            };
            const outDir = process.env.BUNDLE_DIR || '.wesley';
            fs.mkdirSync(outDir, { recursive: true });
            const outPath = path.join(outDir, 'moriarty-context.json');
            fs.writeFileSync(outPath, JSON.stringify(out, null, 2));
            core.info(`Wrote ${outPath}`);

      - name: '🔮 Run Predictions'
        id: moriarty
        uses: ./.github/actions/run-holmes-command
        with:
          command: predict
          report-name: moriarty
          schema-path: ${{ matrix.schema_set.schema }}
          bundle-dir: ${{ matrix.schema_set.bundle_dir }}
        env:
          MORIARTY_BASE_REF: '${{ github.base_ref }}'
          MORIARTY_USE_GIT: '1'
          MORIARTY_GIT_WINDOW_HOURS: '24'
          MORIARTY_ACTIVITY_THRESHOLD: '0.35'
          MORIARTY_ACTIVITY_COMMITS_PER_DAY: '6'
          MORIARTY_ACTIVITY_RELEVANT_PER_DAY: '4'

      - name: '📚 Scope Report'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "reports-by-schema/${{ matrix.schema_set.id }}"
          cp -R reports/moriarty "reports-by-schema/${{ matrix.schema_set.id }}/"

      - name: '💾 Save Report'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moriarty-report-${{ matrix.schema_set.id }}
          path: reports-by-schema/${{ matrix.schema_set.id }}
          if-no-files-found: error

  comment-report:
    name: '📝 Post Investigation Report'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.detect-schema-sets.outputs.selected_count != '0' && needs.detect-schema-sets.outputs.comment_mode != 'silent'
    needs: [detect-schema-sets, holmes-investigate, watson-verify, moriarty-predict]
    env:
      HOLMES_STATUS: ${{ needs.holmes-investigate.result }}
      WATSON_STATUS: ${{ needs.watson-verify.result }}
      MORIARTY_STATUS: ${{ needs.moriarty-predict.result }}

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Harden runner

        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920

        with:
          egress-policy: audit
      - name: '📦 Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: '📥 Download Reports'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true
          path: reports

      - name: '📥 Download Dashboard Template'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dashboard-template
          path: dashboard-template

      - name: '📊 Assemble Dashboard'
        run: |
          set -euo pipefail
          mkdir -p dashboard
          template_path=$(find dashboard-template -name "index.html" -print -quit)
          if [ -z "$template_path" ]; then
            echo "Dashboard template index.html not found" >&2
            exit 1
          fi
          template_dir=$(dirname "$template_path")
          cp -R "$template_dir"/. dashboard/
          mkdir -p reports
          missing=0
          for report in holmes watson moriarty; do
            src=$(find reports -name "$report-report.json" -print -quit)
            if [ -z "$src" ]; then
              echo "Missing $report-report.json" >&2
              missing=1
            else
              cp "$src" "dashboard/$report-report.json"
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "Dashboard assembly failed due to missing report JSON" >&2
            exit 1
          fi

      - name: '📤 Upload Dashboard'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: holmes-dashboard
          path: dashboard
          if-no-files-found: error

      - name: '🧾 Build PR Comment'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCHEMA_SETS_JSON: ${{ needs.detect-schema-sets.outputs.schema_sets }}
        run: |
          set -euo pipefail
          node packages/wesley-holmes/src/pr-comment-cli.mjs \
            --reports-dir reports \
            --schema-sets-json "$SCHEMA_SETS_JSON" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$GITHUB_SHA" \
            --holmes-status "$HOLMES_STATUS" \
            --watson-status "$WATSON_STATUS" \
            --moriarty-status "$MORIARTY_STATUS" \
            > reports/pr-comment.md

      - name: '📝 Create Comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- HOLMES_SUITE_COMMENT -->';
            const body = fs.readFileSync('reports/pr-comment.md', 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const legacyBotComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              !comment.body.includes(marker) &&
              comment.body.includes('The Case of Pull Request')
            );
            if (legacyBotComment) {
              core.warning(`Detected a legacy HOLMES-like bot comment without marker at comment ${legacyBotComment.id}; leaving it untouched.`);
            }

            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
