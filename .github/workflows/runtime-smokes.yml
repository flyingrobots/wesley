name: Legacy Compatibility - Runtime Smokes

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno-smoke:
    name: Legacy compatibility - Deno host smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install bats
        uses: ./.github/actions/install-bats
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Deno lint (smoke files)
        run: |
          deno lint --config deno.json scripts/deno_smoke.ts
      - name: Deno host contracts (Bats)
        env:
          BATS_LIB_PATH: packages/wesley-cli/test
          TERM: xterm
          BATS_NO_COLOR: '1'
        run: |
          rm -rf test/hosts/bats-plugins || true
          ln -sfn "$PWD/packages/wesley-cli/test/bats-plugins" test/hosts/bats-plugins
          timeout 2m bash scripts/setup-bats-plugins.sh
          HOST=deno bats -t test/hosts/host-contracts.bats

  bun-smoke:
    name: Legacy compatibility - Bun host smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install bats
        uses: ./.github/actions/install-bats
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.20
      - name: Bun host contracts (Bats)
        env:
          BATS_LIB_PATH: packages/wesley-cli/test
          TERM: xterm
          BATS_NO_COLOR: '1'
        run: |
          rm -rf test/hosts/bats-plugins || true
          ln -sfn "$PWD/packages/wesley-cli/test/bats-plugins" test/hosts/bats-plugins
          timeout 2m bash scripts/setup-bats-plugins.sh
          HOST=bun bats -t test/hosts/host-contracts.bats

  node-smoke:
    name: Legacy compatibility - Node host smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 9.15.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: Install bats
        uses: ./.github/actions/install-bats
      - name: Node host contracts (Bats)
        env:
          BATS_LIB_PATH: packages/wesley-cli/test
          TERM: xterm
          BATS_NO_COLOR: '1'
        run: |
          rm -rf test/hosts/bats-plugins || true
          ln -sfn "$PWD/packages/wesley-cli/test/bats-plugins" test/hosts/bats-plugins
          timeout 2m bash scripts/setup-bats-plugins.sh
          HOST=node bats -t test/hosts/host-contracts.bats
