name: Rust Product - Native CLI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/**'
      - 'package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'schemas/**'
      - 'scripts/generate-cli-reference.mjs'
      - 'scripts/json-duplicate-key.mjs'
      - 'scripts/run-doc-examples.mjs'
      - 'scripts/wesley-help.mjs'
      - 'test/fixtures/extension-generation/**'
      - 'test/fixtures/ir-parity/**'
      - 'test/fixtures/weslaw/**'
      - 'xtask/**'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/**'
      - 'package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'schemas/**'
      - 'scripts/generate-cli-reference.mjs'
      - 'scripts/json-duplicate-key.mjs'
      - 'scripts/run-doc-examples.mjs'
      - 'scripts/wesley-help.mjs'
      - 'test/fixtures/extension-generation/**'
      - 'test/fixtures/ir-parity/**'
      - 'test/fixtures/weslaw/**'
      - 'xtask/**'

jobs:
  rust-product-preflight:
    name: Rust product preflight
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      # preflight builds the Holmes domain for a target that has no std, to hold
      # its purity boundary. In CI a missing target fails that check.
      - name: Install the bare-metal Rust target
        run: rustup target add thumbv7em-none-eabihf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Run Rust-native preflight
        run: cargo xtask preflight
