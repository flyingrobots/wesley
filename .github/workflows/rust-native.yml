name: Rust Product - Native CLI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/BEARING.md'
      - 'docs/GUIDE.md'
      - 'package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'schemas/**'
      - 'test/fixtures/extension-generation/**'
      - 'test/fixtures/ir-parity/**'
      - 'xtask/**'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/BEARING.md'
      - 'docs/GUIDE.md'
      - 'package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'schemas/**'
      - 'test/fixtures/extension-generation/**'
      - 'test/fixtures/ir-parity/**'
      - 'xtask/**'

jobs:
  rust-product-preflight:
    name: Rust product preflight
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Run Rust-native preflight
        run: cargo xtask preflight
