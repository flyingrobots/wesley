name: Rust Product - Native CLI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/BEARING.md'
      - 'docs/GUIDE.md'
      - 'package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'test/fixtures/ir-parity/**'
      - 'wesley-website/package.json'
      - 'xtask/**'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/BEARING.md'
      - 'docs/GUIDE.md'
      - 'package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'README.md'
      - 'test/fixtures/ir-parity/**'
      - 'wesley-website/package.json'
      - 'xtask/**'

jobs:
  rust-product-preflight:
    name: Rust product preflight
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 9.15.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Verify pnpm version
        run: |
          echo "pnpm: $(pnpm --version)"
          node -v
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Run Rust-native preflight
        run: cargo xtask preflight
