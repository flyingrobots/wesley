name: Rust Product - Native CLI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/BEARING.md'
      - 'docs/GUIDE.md'
      - 'README.md'
      - 'test/fixtures/ir-parity/**'
      - 'xtask/**'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/rust-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'docs/BEARING.md'
      - 'docs/GUIDE.md'
      - 'README.md'
      - 'test/fixtures/ir-parity/**'
      - 'xtask/**'

jobs:
  rust-product-preflight:
    name: Rust product preflight
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Run Rust-native preflight
        run: cargo xtask preflight
