# Echo WASM ABI Response Types
# Version: 1.0.0
#
# These types define the binary wire format for responses crossing
# the WASM FFI boundary between Echo (Rust) and the host (JavaScript).
#
# Custom scalars:
#   Hash32 — Fixed 32-byte BLAKE3 hash (encoded as raw bytes, no length prefix)
#   Bytes  — Variable-length byte blob (u32 LE length prefix + raw bytes)
#   U32    — Unsigned 32-bit integer (4 bytes little-endian)
#   U64    — Unsigned 64-bit integer (8 bytes little-endian)
#
# Envelope format:
#   Success: [0x01] [encoded response bytes...]
#   Error:   [0x00] [u32 LE error code] [u32 LE message length] [UTF-8 message bytes...]

scalar Hash32
scalar Bytes
scalar U32
scalar U64

type DispatchResponse {
  accepted: Boolean!
  intentId: Hash32!
}

type HeadInfo {
  commitId: Hash32!
  stateRoot: Hash32!
  tick: U64!
}

type StepResponse {
  head: HeadInfo!
  ticksExecuted: U32!
}

type ChannelData {
  channelId: Hash32!
  data: Bytes!
}

type DrainResponse {
  channels: [ChannelData!]!
}

type RegistryInfo {
  abiVersion: U32!
  codecId: String
  registryVersion: String
  schemaSha256Hex: String
}

type AbiError {
  code: U32!
  message: String!
}
