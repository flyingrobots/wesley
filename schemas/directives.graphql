"""
Wesley Canonical Directives
Version: 1.1.0

These directives extend GraphQL schemas with Wesley's generic composition and
compiler metadata. Product-specific directive families belong in their owning
modules.

CANONICAL NAMESPACE: @wes_* (preferred)

This file is a registry, not a support guarantee. See docs/DIRECTIVES.md for
the directive truth table that classifies current, experimental, external,
deferred, and dead directive semantics.
"""

# Shared scalars used by directives
scalar JSON

# ═══════════════════════════════════════════════════════════════════
# SCHEMA COMPOSITION DIRECTIVES - Multi-file imports and namespacing
# ═══════════════════════════════════════════════════════════════════

directive @wes_package(
  name: String!
) on SCHEMA

directive @wes_import(
  from: String!
) on SCHEMA

# ═══════════════════════════════════════════════════════════════════
# CORE DIRECTIVES - Table and Field Markers (Canonical @wes_ namespace)
# ═══════════════════════════════════════════════════════════════════

directive @wes_table(
  name: String
) on OBJECT

directive @wes_pk on FIELD_DEFINITION

directive @wes_fk(
  ref: String!
) on FIELD_DEFINITION

directive @wes_unique on FIELD_DEFINITION

directive @wes_index(
  name: String
  using: String
) on FIELD_DEFINITION | OBJECT

directive @wes_tenant(
  by: String!
) on OBJECT

directive @wes_default(
  value: String!
) on FIELD_DEFINITION

directive @wes_uid(
  value: String!
) on FIELD_DEFINITION | OBJECT

directive @wes_weight(
  value: Int!
) on FIELD_DEFINITION | OBJECT

directive @wes_critical on FIELD_DEFINITION | OBJECT
directive @wes_sensitive on FIELD_DEFINITION | OBJECT
directive @wes_pii on FIELD_DEFINITION | OBJECT

directive @wes_hasMany(
  type: String!
  field: String
  via: String
) on FIELD_DEFINITION

directive @wes_belongsTo(
  ref: String!
) on FIELD_DEFINITION

directive @wes_owner(
  column: String
  select: String
  insert: String
  update: String
  delete: String
) on OBJECT

directive @wes_grant(
  roles: [String!]
) on OBJECT | FIELD_DEFINITION

directive @wes_noRPC on OBJECT

directive @wes_rls(
  using: String
  check: String
  select: String
  insert: String
  update: String
  delete: String
  roles: [String!]
  selectRoles: [String!]
  insertRoles: [String!]
  updateRoles: [String!]
  deleteRoles: [String!]
  preset: String
  name: String
  options: JSON
) on OBJECT

# ═══════════════════════════════════════════════════════════════════
# LEGACY ALIASES (Deprecated - use @wes_* instead)
# ═══════════════════════════════════════════════════════════════════

directive @wesley_table(name: String) on OBJECT
directive @wesley_pk on FIELD_DEFINITION
directive @wesley_fk(ref: String!) on FIELD_DEFINITION
directive @wesley_unique on FIELD_DEFINITION
directive @wesley_index(name: String, using: String) on FIELD_DEFINITION | OBJECT
directive @wesley_tenant(by: String!) on OBJECT
directive @wesley_default(value: String!) on FIELD_DEFINITION
directive @wesley_uid(value: String!) on FIELD_DEFINITION | OBJECT
directive @wesley_weight(value: Int!) on FIELD_DEFINITION | OBJECT
directive @wesley_critical on FIELD_DEFINITION | OBJECT
directive @wesley_sensitive on FIELD_DEFINITION | OBJECT
directive @wesley_pii on FIELD_DEFINITION | OBJECT
directive @wesley_hasMany(type: String!, field: String, via: String) on FIELD_DEFINITION
directive @wesley_belongsTo(ref: String!) on FIELD_DEFINITION
directive @wesley_owner(column: String, select: String, insert: String, update: String, delete: String) on OBJECT
directive @wesley_grant(roles: [String!]) on OBJECT | FIELD_DEFINITION
directive @wesley_noRPC on OBJECT
directive @wesley_rls(
  using: String
  check: String
  select: String
  insert: String
  update: String
  delete: String
  roles: [String!]
  selectRoles: [String!]
  insertRoles: [String!]
  updateRoles: [String!]
  deleteRoles: [String!]
  preset: String
  name: String
  options: JSON
) on OBJECT

directive @table on OBJECT
directive @pk on FIELD_DEFINITION
directive @fk(ref: String!) on FIELD_DEFINITION
directive @unique on FIELD_DEFINITION
directive @index(name: String, using: String) on FIELD_DEFINITION | OBJECT
directive @tenant(by: String!) on OBJECT
directive @default(value: String!) on FIELD_DEFINITION
directive @uid(value: String!) on FIELD_DEFINITION | OBJECT
directive @weight(value: Int!) on FIELD_DEFINITION | OBJECT
directive @critical on FIELD_DEFINITION | OBJECT
directive @sensitive on FIELD_DEFINITION | OBJECT
directive @pii on FIELD_DEFINITION | OBJECT
directive @primaryKey on FIELD_DEFINITION | OBJECT
directive @foreignKey(ref: String!) on FIELD_DEFINITION
directive @hasMany(type: String!, field: String, via: String) on FIELD_DEFINITION
directive @belongsTo(ref: String!) on FIELD_DEFINITION
directive @owner(column: String, select: String, insert: String, update: String, delete: String) on OBJECT
directive @grant(roles: [String!]) on OBJECT | FIELD_DEFINITION
directive @noRPC on OBJECT
directive @rls(
  using: String
  check: String
  select: String
  insert: String
  update: String
  delete: String
  roles: [String!]
  selectRoles: [String!]
  insertRoles: [String!]
  updateRoles: [String!]
  deleteRoles: [String!]
  preset: String
  name: String
  options: JSON
) on OBJECT

# ═══════════════════════════════════════════════════════════════════
# JOIN DIRECTIVES - Generic deterministic merge metadata
# ═══════════════════════════════════════════════════════════════════

# Join: Declares the merge strategy for a field under concurrent writes
directive @wes_join(
  strategy: String!           # "union" | "max" | "lww"
) on FIELD_DEFINITION

# View: Declares per-rule field access level for guarded view generation
directive @wes_view(
  rule: String!             # Rule name (e.g. "owner", "admin")
  access: String!           # Access level: "READ" or "WRITE"
) on FIELD_DEFINITION

# Note: Additional directives for relationships, RLS, validation, etc.
# can be added here as needed. For now, focusing on core table directives.
