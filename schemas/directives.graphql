# ═══════════════════════════════════════════════════════════════════
# TTD PROTOCOL DIRECTIVES - Typed Transition Dynamics (Canonical @wes_ namespace)
# ═══════════════════════════════════════════════════════════════════

# Channel: Defines a message channel with typed payloads
directive @wes_channel(
  name: String              # Channel name (defaults to type name)
  version: Int              # Protocol version (defaults to 1)
  ordered: Boolean          # Whether messages are ordered (defaults to true)
  persistent: Boolean       # Whether messages are persisted (defaults to false)
) on OBJECT

# Op: Defines an operation that can be invoked
directive @wes_op(
  name: String              # Operation name (defaults to field name)
  idempotent: Boolean       # Whether op is idempotent (defaults to false)
  readonly: Boolean         # Whether op only reads state (defaults to false)
  timeout: Int              # Timeout in milliseconds (optional)
) on FIELD_DEFINITION

# Rule: Defines a transition rule for state machines
directive @wes_rule(
  name: String!             # Rule name
  from: [String!]!          # Source states
  to: String!               # Target state
  guard: String             # Guard expression (optional)
) on FIELD_DEFINITION

# Invariant: Defines a system invariant (law)
directive @wes_invariant(
  name: String!             # Invariant name
  expr: String!             # Invariant expression in TTD expression language
  severity: String          # "error" | "warning" (defaults to "error")
) on OBJECT | FIELD_DEFINITION

# Emission: Defines an emission contract for an operation
directive @wes_emission(
  channel: String!          # Target channel name
  event: String!            # Event type name
  condition: String         # Condition expression (optional)
) on FIELD_DEFINITION

# Footprint: Defines resource footprint for an operation
directive @wes_footprint(
  reads: [String!]          # Resources read
  writes: [String!]         # Resources written
  creates: [String!]        # Resources created
  deletes: [String!]        # Resources deleted
) on FIELD_DEFINITION

# Requires: Declares prerequisites for an operation
directive @wes_requires(
  ops: [String!]            # Required prior operations
  state: String             # Required state expression
  permissions: [String!]    # Required permissions
) on FIELD_DEFINITION

# Produces: Declares what an operation produces
directive @wes_produces(
  events: [String!]         # Events produced
  state: String             # Resulting state expression
) on FIELD_DEFINITION

# EmitsTo: Simplified emission declaration
directive @wes_emitsTo(
  channel: String!          # Target channel
  within: Int               # Max delay in milliseconds (optional)
) on FIELD_DEFINITION

# MustEmit: Asserts that an event must be emitted
directive @wes_mustEmit(
  event: String!            # Event type that must be emitted
  within: Int               # Max delay in milliseconds (optional)
) on FIELD_DEFINITION

# Codec: Specifies serialization codec for a type
directive @wes_codec(
  format: String!           # "cbor" | "json" | "protobuf"
  canonical: Boolean        # Whether to use canonical encoding (defaults to true for cbor)
) on OBJECT

# Registry: Marks a type for inclusion in the registry
directive @wes_registry(
  id: Int                   # Explicit registry ID (auto-assigned if omitted)
  deprecated: Boolean       # Whether this entry is deprecated
  deprecatedBy: String      # Replacement type name if deprecated
) on OBJECT | FIELD_DEFINITION

# StateField: Marks a field as part of state
directive @wes_stateField(
  key: Boolean              # Whether this field is a state key
  derived: Boolean          # Whether this field is derived from other fields
  derivation: String        # Derivation expression if derived=true
) on FIELD_DEFINITION

# Tick: Marks a type as a tick event (time-based trigger)
directive @wes_tick(
  interval: Int!            # Interval in milliseconds
  jitter: Int               # Max jitter in milliseconds (optional)
) on OBJECT

# Effect: Declares side effects of an operation
directive @wes_effect(
  type: String!             # Effect type: "network" | "storage" | "clock" | "random"
  description: String       # Human-readable description
) on FIELD_DEFINITION

# Constraint: Declares a constraint on a field
directive @wes_constraint(
  min: Int                  # Minimum value (for numbers)
  max: Int                  # Maximum value (for numbers)
  minLength: Int            # Minimum length (for strings/arrays)
  maxLength: Int            # Maximum length (for strings/arrays)
  pattern: String           # Regex pattern (for strings)
  oneOf: [String!]          # Allowed values
) on FIELD_DEFINITION

# Version: Marks schema version for a type
directive @wes_version(
  major: Int!               # Major version
  minor: Int!               # Minor version
  patch: Int                # Patch version (defaults to 0)
) on OBJECT

# ═══════════════════════════════════════════════════════════════════
# ECHO LATTICE / CRDT DIRECTIVES - Join strategies for merge semantics
# ═══════════════════════════════════════════════════════════════════

# Join: Declares the merge strategy for a field under concurrent writes
directive @wes_join(
  strategy: String!           # "union" | "max" | "lww"
) on FIELD_DEFINITION

# View: Declares per-rule field access level for guarded view generation
directive @wes_view(
  rule: String!             # Rule name (e.g. "owner", "admin")
  access: String!           # Access level: "READ" or "WRITE"
) on FIELD_DEFINITION

# Note: Additional directives for relationships, RLS, validation, etc.
# can be added here as needed. For now, focusing on core table directives.
