<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Roadmap — Gantt Chart</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #e6edf3; }
  .subtitle { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
  .legend {
    display: flex; gap: 20px; margin-bottom: 16px; font-size: 12px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
  }
  .chart-container {
    overflow-x: auto;
    border: 1px solid #30363d;
    border-radius: 6px;
    background: #161b22;
  }
  svg { display: block; }

  /* Tooltip */
  .tooltip {
    position: absolute; pointer-events: none;
    background: #1c2128; border: 1px solid #30363d;
    border-radius: 6px; padding: 10px 14px;
    font-size: 12px; line-height: 1.5;
    color: #c9d1d9; max-width: 340px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    z-index: 10;
    opacity: 0; transition: opacity .15s;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip strong { color: #e6edf3; }
  .tooltip .critical { color: #f85149; font-weight: 600; }

  /* Phase separator labels */
  .phase-label {
    font-size: 11px; font-weight: 600; fill: #8b949e;
    text-transform: uppercase; letter-spacing: .5px;
  }
</style>
</head>
<body>

<h1>Echo Roadmap — Gantt Chart</h1>
<p class="subtitle">22 tasks across 5 phases. Critical path highlighted. Hover for details.</p>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#f85149"></div> Critical path</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#58a6ff"></div> Parallel work</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#3fb950"></div> Early wins</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#8b949e"></div> Documentation</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#d2a8ff; opacity:.4"></div> Dependency arrow</div>
  <span style="margin-left:12px; border-left:1px solid #30363d; padding-left:16px; display:flex; gap:16px; align-items:center;">
    <span style="color:#8b949e; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px;">Milestones</span>
    <div class="legend-item"><div class="legend-swatch" style="background:#da8ee7"></div> E0 Plugin Pipeline</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#f0883e"></div> E1 Schema Hashing</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#54aeff"></div> E2 Encoding</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#57ab5a"></div> E3 Joins</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#e5534b"></div> E4 Privacy</div>
  </span>
</div>

<div class="chart-container" id="chart"></div>

<div class="tooltip" id="tooltip"></div>

<script>
// ── Task data ──────────────────────────────────────────────────────────
// Hours are midpoint of estimates. start/end are in cumulative hours
// laid out to respect dependencies + parallelism.

const tasks = [
  // Phase 1: Foundation
  { id: "E0.1", milestone: "E0", name: "GeneratorPlugin Contract", phase: 1, estLo: 6, estHi: 10, blockedBy: [], critical: true,
    desc: "Stable GeneratorPlugin interface in @wesley/core" },
  { id: "E0.2", milestone: "E0", name: "Plugin Discovery", phase: 1, estLo: 4, estHi: 6, blockedBy: ["E0.1"], critical: false,
    desc: "Config-driven plugin discovery via wesley.config.mjs" },
  { id: "E0.3", milestone: "E0", name: "Test Harness", phase: 1, estLo: 3, estHi: 5, blockedBy: ["E0.1"], critical: false,
    desc: "In-memory generator test harness for plugin authors" },
  { id: "E0.4", milestone: "E0", name: "Lifecycle Docs", phase: 1, estLo: 4, estHi: 6, blockedBy: ["E0.2", "E0.3"], critical: false, docs: true,
    desc: "Plugin lifecycle documentation for generator authors" },
  { id: "E0.5", milestone: "E0", name: "wesley doctor", phase: 1, estLo: 3, estHi: 5, blockedBy: ["E0.2"], critical: false, earlyWin: true,
    desc: "Diagnostic CLI command to verify installation health" },

  // Phase 2: Trust Root
  { id: "E1.1", milestone: "E1", name: "Canonical AST", phase: 2, estLo: 8, estHi: 12, blockedBy: ["E0.1"], critical: true,
    desc: "Deterministic, stable canonical AST serialization" },
  { id: "E1.2", milestone: "E1", name: "schema_hash", phase: 2, estLo: 3, estHi: 5, blockedBy: ["E1.1"], critical: true,
    desc: "SHA-256 hash of canonical AST bytes" },
  { id: "E1.3", milestone: "E1", name: "registry_hash", phase: 2, estLo: 3, estHi: 5, blockedBy: ["E0.1", "E1.2"], critical: true,
    desc: "SHA-256 hash of the full generated registry blob" },
  { id: "E1.4", milestone: "E1", name: "Hash Chain", phase: 2, estLo: 4, estHi: 6, blockedBy: ["E1.1", "E1.2", "E1.3"], critical: true,
    desc: "SDL → IR → bundle hash chain for auditability" },
  { id: "E1.5", milestone: "E1", name: "echo-ir/v2", phase: 2, estLo: 5, estHi: 8, blockedBy: ["E1.2", "E1.3", "E1.4"], critical: true,
    desc: "IR format bump carrying hash fields + join annotations" },
  { id: "E1.6", milestone: "E1", name: "SchemaDelta", phase: 2, estLo: 8, estHi: 12, blockedBy: ["E1.1"], critical: false, earlyWin: true,
    desc: "Machine-readable vocabulary for schema changes" },
  { id: "E1.7", milestone: "E1", name: "wesley diff", phase: 2, estLo: 4, estHi: 6, blockedBy: ["E1.6"], critical: false, earlyWin: true,
    desc: "CLI command for human + machine-readable schema diff" },

  // Phase 2 parallel track: E3 start
  { id: "E3.1", milestone: "E3", name: "@wes_join Parsing", phase: 2, estLo: 4, estHi: 6, blockedBy: ["E0.1"], critical: false,
    desc: "Directive parsing and field-type validation for @wes_join" },
  { id: "E3.3", milestone: "E3", name: "Join Docs", phase: 2, estLo: 4, estHi: 6, blockedBy: ["E3.1"], critical: false, docs: true,
    desc: "ACI property docs and decision guide for join strategies" },

  // Phase 3: Deterministic Encoding
  { id: "E2a.1", milestone: "E2", name: "raw_le Rust", phase: 3, estLo: 16, estHi: 24, blockedBy: ["E0.1", "E1.1", "E1.5"], critical: true,
    desc: "Deterministic raw_le encoder/decoder gen for Rust (BOTTLENECK)" },
  { id: "E2a.2", milestone: "E2", name: "raw_le TypeScript", phase: 3, estLo: 12, estHi: 18, blockedBy: ["E2a.1"], critical: true,
    desc: "Byte-identical TypeScript encoders matching Rust output" },
  { id: "E2a.3", milestone: "E2", name: "layout_hash", phase: 3, estLo: 4, estHi: 6, blockedBy: ["E2a.1", "E1.5"], critical: false,
    desc: "Per-type hash of the exact codec byte layout" },
  { id: "E2b.1", milestone: "E2", name: "Core Type Schemas", phase: 3, estLo: 4, estHi: 6, blockedBy: ["E0.1", "E1.5"], critical: false,
    desc: "Wesley SDL definitions for Echo's 5 core storage types" },
  { id: "E3.2", milestone: "E3", name: "Join Codegen", phase: 3, estLo: 10, estHi: 16, blockedBy: ["E3.1", "E1.5"], critical: false,
    desc: "Rust JoinFn trait codegen for union/max/lww strategies" },

  // Phase 4: Cross-Platform Proof
  { id: "E2d.1", milestone: "E2", name: "Golden Vectors", phase: 4, estLo: 8, estHi: 12, blockedBy: ["E2a.1", "E2a.2"], critical: true,
    desc: "Cross-platform golden vector test suite (Rust + TS)" },

  // Phase 5: Views + Privacy
  { id: "E2c.1", milestone: "E2", name: "GuardedView", phase: 5, estLo: 10, estHi: 16, blockedBy: ["E0.1", "E2a.1"], critical: false,
    desc: "Compile-time view structs restricting field access per rule" },
  { id: "E4.1", milestone: "E4", name: "Privacy Types", phase: 5, estLo: 6, estHi: 10, blockedBy: ["E2a.1", "E2a.2", "E2b.1"], critical: false,
    desc: "Canonical encoders + golden vectors for 3 privacy types" },
];

const phaseNames = {
  1: "Phase 1: Foundation",
  2: "Phase 2: Trust Root",
  3: "Phase 3: Deterministic Encoding",
  4: "Phase 4: Cross-Platform Proof",
  5: "Phase 5: Views + Privacy",
};

const milestoneColors = {
  E0: "#da8ee7",  // purple
  E1: "#f0883e",  // orange
  E2: "#54aeff",  // blue
  E3: "#57ab5a",  // green
  E4: "#e5534b",  // red
};

const milestoneNames = {
  E0: "Plugin Pipeline",
  E1: "Schema Hash Pinning",
  E2: "Canonical Encoding",
  E3: "@wes_join Directives",
  E4: "Privacy Types",
};

// ── Schedule layout (topological, respecting deps) ─────────────────────

const taskMap = new Map(tasks.map(t => [t.id, t]));

// Compute earliest start based on dependencies
function computeSchedule() {
  const scheduled = new Map(); // id -> { start, end }

  function schedule(id) {
    if (scheduled.has(id)) return scheduled.get(id);
    const task = taskMap.get(id);
    const dur = (task.estLo + task.estHi) / 2;
    let start = 0;
    for (const dep of task.blockedBy) {
      const depSched = schedule(dep);
      start = Math.max(start, depSched.end);
    }
    const result = { start, end: start + dur };
    scheduled.set(id, result);
    return result;
  }

  tasks.forEach(t => schedule(t.id));
  return scheduled;
}

const schedule = computeSchedule();

// ── D3 chart ───────────────────────────────────────────────────────────

const rowHeight = 30;
const rowPad = 4;
const labelWidth = 180;
const rightPad = 40;
const topMargin = 36;
const bottomMargin = 30;

const maxEnd = d3.max(tasks, t => schedule.get(t.id).end);
const chartWidth = Math.max(960, labelWidth + maxEnd * 8 + rightPad);
const chartHeight = topMargin + tasks.length * rowHeight + bottomMargin;

const xScale = d3.scaleLinear()
  .domain([0, maxEnd])
  .range([labelWidth, chartWidth - rightPad]);

const svg = d3.select("#chart")
  .append("svg")
  .attr("width", chartWidth)
  .attr("height", chartHeight);

// Background grid
const tickVals = d3.range(0, maxEnd + 10, 10);
svg.append("g")
  .selectAll("line")
  .data(tickVals)
  .join("line")
  .attr("x1", d => xScale(d)).attr("x2", d => xScale(d))
  .attr("y1", topMargin).attr("y2", chartHeight - bottomMargin)
  .attr("stroke", "#21262d").attr("stroke-width", 1);

// Hour axis
svg.append("g")
  .selectAll("text")
  .data(tickVals)
  .join("text")
  .attr("x", d => xScale(d)).attr("y", topMargin - 8)
  .attr("text-anchor", "middle")
  .attr("fill", "#484f58").attr("font-size", 10)
  .text(d => d + "h");

// Phase separators
let prevPhase = 0;
tasks.forEach((t, i) => {
  if (t.phase !== prevPhase) {
    const y = topMargin + i * rowHeight;
    if (prevPhase !== 0) {
      svg.append("line")
        .attr("x1", 0).attr("x2", chartWidth)
        .attr("y1", y).attr("y2", y)
        .attr("stroke", "#30363d").attr("stroke-dasharray", "4,3");
    }
    svg.append("text")
      .attr("class", "phase-label")
      .attr("x", 6).attr("y", y + 11)
      .text(phaseNames[t.phase]);
    prevPhase = t.phase;
  }
});

// Tooltip
const tooltip = d3.select("#tooltip");

function showTooltip(event, t) {
  const s = schedule.get(t.id);
  const deps = t.blockedBy.length ? t.blockedBy.join(", ") : "none";
  tooltip
    .html(`
      <strong>${t.id}</strong> — ${t.name}<br>
      ${t.desc}<br><br>
      <strong>Est:</strong> ${t.estLo}–${t.estHi}h &nbsp;
      <strong>Start:</strong> ${s.start.toFixed(0)}h &nbsp;
      <strong>End:</strong> ${s.end.toFixed(0)}h<br>
      <strong>Blocked by:</strong> ${deps}<br>
      <strong>Milestone:</strong> <span style="color:${milestoneColors[t.milestone]}">${t.milestone} — ${milestoneNames[t.milestone]}</span> &nbsp;
      <strong>Phase:</strong> ${t.phase}
      ${t.critical ? '<br><span class="critical">ON CRITICAL PATH</span>' : ''}
    `)
    .classed("visible", true)
    .style("left", (event.pageX + 12) + "px")
    .style("top", (event.pageY - 10) + "px");
}

function hideTooltip() {
  tooltip.classed("visible", false);
}

// Dependency arrows (drawn before bars so bars sit on top)
const arrowGroup = svg.append("g");
tasks.forEach((t, i) => {
  const tSched = schedule.get(t.id);
  const ty = topMargin + i * rowHeight + rowHeight / 2;
  t.blockedBy.forEach(depId => {
    const depIdx = tasks.findIndex(d => d.id === depId);
    if (depIdx < 0) return;
    const depSched = schedule.get(depId);
    const dy = topMargin + depIdx * rowHeight + rowHeight / 2;
    arrowGroup.append("path")
      .attr("d", () => {
        const x1 = xScale(depSched.end);
        const x2 = xScale(tSched.start);
        const midX = (x1 + x2) / 2;
        return `M${x1},${dy} C${midX},${dy} ${midX},${ty} ${x2},${ty}`;
      })
      .attr("fill", "none")
      .attr("stroke", "#d2a8ff")
      .attr("stroke-opacity", 0.2)
      .attr("stroke-width", 1);
  });
});

// Milestone row backgrounds — subtle tinted bands
const bgGroup = svg.append("g");
tasks.forEach((t, i) => {
  const y = topMargin + i * rowHeight;
  bgGroup.append("rect")
    .attr("x", 0).attr("y", y)
    .attr("width", chartWidth).attr("height", rowHeight)
    .attr("fill", milestoneColors[t.milestone])
    .attr("opacity", 0.04);
});

// Milestone boundary lines — drawn where the milestone changes between adjacent rows
tasks.forEach((t, i) => {
  if (i === 0) return;
  const prev = tasks[i - 1];
  if (prev.milestone !== t.milestone) {
    const y = topMargin + i * rowHeight;
    bgGroup.append("line")
      .attr("x1", 0).attr("x2", labelWidth - 4)
      .attr("y1", y).attr("y2", y)
      .attr("stroke", milestoneColors[t.milestone])
      .attr("stroke-opacity", 0.35)
      .attr("stroke-width", 1);
  }
});

// Bars
function barColor(t) {
  if (t.critical) return "#f85149";
  if (t.earlyWin) return "#3fb950";
  if (t.docs) return "#8b949e";
  return "#58a6ff";
}

const rows = svg.append("g")
  .selectAll("g")
  .data(tasks)
  .join("g")
  .attr("transform", (d, i) => `translate(0, ${topMargin + i * rowHeight})`);

// Milestone badge pill
rows.append("rect")
  .attr("x", 4)
  .attr("y", rowHeight / 2 - 8)
  .attr("width", 24).attr("height", 16)
  .attr("rx", 4).attr("ry", 4)
  .attr("fill", d => milestoneColors[d.milestone])
  .attr("opacity", 0.2);

rows.append("text")
  .attr("x", 16)
  .attr("y", rowHeight / 2 + 1)
  .attr("text-anchor", "middle")
  .attr("dominant-baseline", "middle")
  .attr("fill", d => milestoneColors[d.milestone])
  .attr("font-size", 9)
  .attr("font-weight", 700)
  .text(d => d.milestone);

// Row label (task ID, shifted right to make room for badge)
rows.append("text")
  .attr("x", labelWidth - 8)
  .attr("y", rowHeight / 2 + 1)
  .attr("text-anchor", "end")
  .attr("dominant-baseline", "middle")
  .attr("fill", d => d.critical ? "#f85149" : "#8b949e")
  .attr("font-size", 11)
  .attr("font-weight", d => d.critical ? 600 : 400)
  .text(d => d.id);

// Bar
rows.append("rect")
  .attr("x", d => xScale(schedule.get(d.id).start))
  .attr("y", rowPad)
  .attr("width", d => {
    const s = schedule.get(d.id);
    return Math.max(xScale(s.end) - xScale(s.start), 4);
  })
  .attr("height", rowHeight - rowPad * 2)
  .attr("rx", 3).attr("ry", 3)
  .attr("fill", d => barColor(d))
  .attr("opacity", 0.85)
  .on("mouseover", showTooltip)
  .on("mousemove", (event, d) => {
    tooltip
      .style("left", (event.pageX + 12) + "px")
      .style("top", (event.pageY - 10) + "px");
  })
  .on("mouseout", hideTooltip);

// Bar label
rows.append("text")
  .attr("x", d => xScale(schedule.get(d.id).start) + 6)
  .attr("y", rowHeight / 2 + 1)
  .attr("dominant-baseline", "middle")
  .attr("fill", "#e6edf3")
  .attr("font-size", 10)
  .attr("font-weight", 500)
  .text(d => {
    const s = schedule.get(d.id);
    const barW = xScale(s.end) - xScale(s.start);
    return barW > 60 ? d.name : "";
  });

// Bottom axis label
svg.append("text")
  .attr("x", (labelWidth + chartWidth - rightPad) / 2)
  .attr("y", chartHeight - 8)
  .attr("text-anchor", "middle")
  .attr("fill", "#484f58").attr("font-size", 11)
  .text("Cumulative human-hours (midpoint estimates)");

</script>
</body>
</html>
