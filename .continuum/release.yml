schema: 1
repo:
  name: wesley
  owner: flyingrobots
  primary_artifact: rust-crates
  public_binary: wesley
  product_boundary: domain-free-graphql-to-ir

versioning:
  strategy: semver
  tag_format: 'v{version}'
  release_branch_format: 'release/v{version}'
  release_milestone_format: 'v{version}'

version_sources:
  - path: crates/wesley-core/Cargo.toml
    name: wesley-core
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-emit-codec/Cargo.toml
    name: wesley-emit-codec
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-emit-rust/Cargo.toml
    name: wesley-emit-rust
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-emit-typescript/Cargo.toml
    name: wesley-emit-typescript
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-cli/Cargo.toml
    name: wesley-cli
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-holmes/Cargo.toml
    name: wesley-holmes
    type: cargo-manifest
    field: package.version
    required: true
    published: false
  - path: package.json
    name: root-private-package
    type: json
    field: version
    required: true
    published: false

docs:
  changelog: CHANGELOG.md
  front_door:
    - README.md
    - docs/README.md
    - docs/GUIDE.md
    - docs/ENTRYPOINTS.md
  architecture:
    - docs/ARCHITECTURE.md
    - docs/TECHNICAL_TEARDOWN.md
  user_docs:
    - docs/GUIDE.md
    - docs/site/
    - docs/topics/
    - docs/reference/
    - docs/releases/
  operator_docs:
    - RELEASE.md
    - docs/method/release.md
    - docs/method/release-runbook.md
    - docs/CRATES_IO_RELEASE.md
    - docs/governance/RELEASE_POLICY.md
    - docs/governance/RELEASE_CHECKLIST.md
  contributor_docs:
    - AGENTS.md
    - CONTRIBUTING.md
    - RELEASE.md
    - docs/METHOD.md
    - docs/topics/contributing/triage.md

validation:
  docs_check: cargo xtask docs-check
  post_merge_pre_tag_tracker_clear: cargo xtask release-prep-guard --version {version}
  preflight: cargo xtask preflight
  rust_advisory_audit: cargo audit
  release_check: cargo xtask release-check
  package: cargo xtask package-crates --version {version}
  tagged_guard: cargo xtask release-guard --tag v{version}
  legacy_when_needed: cargo xtask legacy-preflight

workflows:
  publish: .github/workflows/release-crates.yml
  publish_trigger: tag-push
  autotag: none

publish:
  manual_dispatch_required: false
  github_release: true
  source_ref: 'v{version}'
  registries:
    - name: crates.io
      packages:
        - wesley-core
        - wesley-emit-codec
        - wesley-emit-rust
        - wesley-emit-typescript
        - wesley-cli
      verify: cargo info {package}@{version}

issue_model:
  live_tracker: github
  scheduling_authority: 'plain v{version} milestone'
  scheduled_state: 'exactly one v{version} milestone and no triage:* or concrete version label'
  unscheduled_state: 'exactly one triage:* label and no milestone'
  classification_axis: 'type, status, legend:*, work:*, and pkg:* labels'
  release_gate: 'final pre-tag issue in the target version milestone'

release_evidence:
  internal_packet: docs/method/releases/v{version}/release.md
  verification: docs/method/releases/v{version}/verification.md
  user_notes: docs/releases/v{version}.md
