schema: 1
repo:
  name: wesley
  owner: flyingrobots
  primary_artifact: rust-crates
  public_binary: wesley
  product_boundary: domain-free-graphql-to-ir

versioning:
  strategy: semver
  tag_format: 'v{version}'
  release_branch_format: 'release/v{version}'
  release_milestone_format: 'Release: v{version}'
  release_lane_label_format: 'v{version}'
  goalpost_milestone_format: 'Goalpost: {name}'

version_sources:
  - path: crates/wesley-core/Cargo.toml
    name: wesley-core
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-emit-codec/Cargo.toml
    name: wesley-emit-codec
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-emit-rust/Cargo.toml
    name: wesley-emit-rust
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-emit-typescript/Cargo.toml
    name: wesley-emit-typescript
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-cli/Cargo.toml
    name: wesley-cli
    type: cargo-manifest
    field: package.version
    required: true
    published: true
  - path: crates/wesley-holmes/Cargo.toml
    name: wesley-holmes
    type: cargo-manifest
    field: package.version
    required: true
    published: false
  - path: package.json
    name: root-private-package
    type: json
    field: version
    required: true
    published: false

docs:
  changelog: CHANGELOG.md
  front_door:
    - README.md
    - docs/getting-started.md
    - docs/cli.md
  architecture:
    - docs/architecture.md
  operator_docs:
    - RELEASE.md
    - docs/ci.md
  contributor_docs:
    - AGENTS.md
    - CONTRIBUTING.md

validation:
  docs_check: cargo xtask docs-check
  prep: cargo xtask release-prep-guard --version {version}
  preflight: cargo xtask preflight
  rust_advisory_audit: cargo audit
  release_check: cargo xtask release-check
  package: cargo xtask package-crates --version {version}
  tagged_guard: cargo xtask release-guard --tag v{version}
  legacy_when_needed: cargo xtask legacy-preflight

workflows:
  publish: .github/workflows/release-crates.yml
  publish_trigger: tag-push-or-dispatch
  autotag: .github/workflows/release-autotag.yml

publish:
  # True for the normal path: autotag pushes its tag with GITHUB_TOKEN, which
  # does not start the publish workflow, so a maintainer dispatches it from the
  # tag. A tag pushed by hand on the manual fallback starts it without a
  # dispatch.
  manual_dispatch_required: true
  github_release: true
  source_ref: 'v{version}'
  registries:
    - name: crates.io
      packages:
        - wesley-core
        - wesley-emit-codec
        - wesley-emit-rust
        - wesley-emit-typescript
        - wesley-cli
      verify: cargo info {package}@{version}

issue_model:
  live_tracker: github
  implementation_bucket: 'Goalpost: ... milestone'
  release_gate_bucket: 'Release: v{version} milestone for gate and closeout issues'
  release_scheduling_axis: 'v{version} label for pre-tag blockers and scheduled work'
  triage_axis: 'triage:* label'
  required_state_label: 'exactly one of triage:* or v{version}'

# Release notes are the version's section of CHANGELOG.md; the publish workflow
# extracts it for the GitHub Release. Evidence of a release is the tag, the
# workflow runs, the GitHub Release, and the registry. No per-release documents
# are kept in the repository.
release_evidence:
  user_notes: CHANGELOG.md
